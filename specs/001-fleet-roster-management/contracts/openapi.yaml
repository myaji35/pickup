openapi: 3.0.3
info:
  title: Pickup MaaS API - 차량 및 승객명단 관리
  description: |
    B2B 송영 서비스를 위한 RESTful API

    **Features**:
    - 001번: 기관 차량 및 승객명단 관리
    - 002번: 주간보호 8시간 케어 스케줄 검증

    **Authentication**: Bearer JWT token required for all endpoints

    **API Conventions**:
    - All timestamps in ISO 8601 format (UTC)
    - All responses include standard error format
    - Pagination uses offset-based strategy
    - Phone numbers stored without hyphens (01012345678)
    - Time values in HH:MM format (24-hour)

  version: 1.0.0
  contact:
    name: Pickup MaaS Team
    email: dev@pickup-maas.com

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-staging.pickup-maas.com/v1
    description: Staging environment
  - url: https://api.pickup-maas.com/v1
    description: Production environment

tags:
  - name: Institutions
    description: 기관 관리 (Institution Management)
  - name: Institution Types
    description: 기관 유형 관리 (Institution Type Management)
  - name: Vehicles
    description: 차량 관리 (Vehicle Management)
  - name: Passenger Groups
    description: 승객 그룹 관리 (Passenger Group Management)
  - name: Passengers
    description: 승객 관리 (Passenger Management)
  - name: Care Time Reports
    description: 케어 시간 검증 및 리포트 (002번 기능)

security:
  - BearerAuth: []

paths:
  # ============================================================================
  # Institution Type Endpoints (기관 유형)
  # ============================================================================
  /institution-types:
    get:
      tags: [Institution Types]
      summary: 기관 유형 목록 조회
      description: 시스템에 등록된 기관 유형 목록 (주간보호, 일반 등)
      operationId: getInstitutionTypes
      responses:
        '200':
          description: 기관 유형 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitutionType'

  # ============================================================================
  # Institution Endpoints (기관)
  # ============================================================================
  /institutions:
    get:
      tags: [Institutions]
      summary: 기관 목록 조회 (Admin only)
      description: 시스템 관리자용 - 모든 기관 목록 조회
      operationId: getAllInstitutions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: institutionTypeId
          in: query
          description: 기관 유형 필터
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 기관 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstitutions'

    post:
      tags: [Institutions]
      summary: 기관 생성
      description: 신규 기관 등록 (사업자등록번호 중복 불가)
      operationId: createInstitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstitutionDto'
      responses:
        '201':
          description: 기관 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '409':
          $ref: '#/components/responses/ConflictError'

  /institutions/{institutionId}:
    get:
      tags: [Institutions]
      summary: 기관 상세 조회
      operationId: getInstitution
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      responses:
        '200':
          description: 기관 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Institutions]
      summary: 기관 정보 수정
      operationId: updateInstitution
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstitutionDto'
      responses:
        '200':
          description: 기관 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'

    delete:
      tags: [Institutions]
      summary: 기관 삭제
      description: 기관 삭제 (CASCADE - 모든 차량, 그룹, 승객 삭제됨)
      operationId: deleteInstitution
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      responses:
        '204':
          description: 기관 삭제 성공

  # ============================================================================
  # Vehicle Endpoints (차량)
  # ============================================================================
  /institutions/{institutionId}/vehicles:
    get:
      tags: [Vehicles]
      summary: 기관의 차량 목록 조회
      description: FR-006 - 특정 기관이 관리하는 모든 차량 조회
      operationId: getVehicles
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - name: groupId
          in: query
          description: 그룹별 필터링
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 차량 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'

    post:
      tags: [Vehicles]
      summary: 차량 등록
      description: FR-010 - 신규 차량 등록
      operationId: createVehicle
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleDto'
      responses:
        '201':
          description: 차량 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '409':
          description: 차량번호 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /institutions/{institutionId}/vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: 차량 상세 조회
      operationId: getVehicle
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/VehicleIdParam'
      responses:
        '200':
          description: 차량 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

    patch:
      tags: [Vehicles]
      summary: 차량 정보 수정
      description: FR-011 - 차량 정보 수정
      operationId: updateVehicle
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/VehicleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleDto'
      responses:
        '200':
          description: 차량 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

    delete:
      tags: [Vehicles]
      summary: 차량 삭제
      description: FR-013 - 차량 삭제 (그룹 연결은 유지됨)
      operationId: deleteVehicle
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/VehicleIdParam'
      responses:
        '204':
          description: 차량 삭제 성공

  /institutions/{institutionId}/vehicles/{vehicleId}/connect-group:
    post:
      tags: [Vehicles]
      summary: 차량-그룹 연결
      description: FR-031 - 차량을 승객 그룹에 연결
      operationId: connectVehicleToGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/VehicleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
              properties:
                groupId:
                  type: string
                  format: uuid
                  description: 연결할 승객 그룹 ID
      responses:
        '200':
          description: 차량-그룹 연결 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /institutions/{institutionId}/vehicles/{vehicleId}/disconnect-group:
    post:
      tags: [Vehicles]
      summary: 차량-그룹 연결 해제
      description: 차량의 그룹 연결 해제
      operationId: disconnectVehicleFromGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/VehicleIdParam'
      responses:
        '200':
          description: 연결 해제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  # ============================================================================
  # Passenger Group Endpoints (승객 그룹)
  # ============================================================================
  /institutions/{institutionId}/passenger-groups:
    get:
      tags: [Passenger Groups]
      summary: 승객 그룹 목록 조회
      description: FR-028 - 기관의 모든 승객 그룹 조회
      operationId: getPassengerGroups
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - name: search
          in: query
          description: 그룹 코드 또는 그룹명 검색
          schema:
            type: string
      responses:
        '200':
          description: 승객 그룹 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PassengerGroup'

    post:
      tags: [Passenger Groups]
      summary: 승객 그룹 생성
      description: FR-024 - 여러 승객을 선택하여 그룹 생성
      operationId: createPassengerGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePassengerGroupDto'
      responses:
        '201':
          description: 승객 그룹 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerGroup'
        '409':
          description: 그룹 코드 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /institutions/{institutionId}/passenger-groups/{groupId}:
    get:
      tags: [Passenger Groups]
      summary: 승객 그룹 상세 조회
      description: FR-029 - 그룹 정보 및 소속 승객 목록 조회
      operationId: getPassengerGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '200':
          description: 승객 그룹 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerGroupDetail'

    patch:
      tags: [Passenger Groups]
      summary: 승객 그룹 수정
      description: FR-025 - 그룹 정보 수정 (이름, 승객 추가/제거)
      operationId: updatePassengerGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/GroupIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassengerGroupDto'
      responses:
        '200':
          description: 그룹 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerGroup'

    delete:
      tags: [Passenger Groups]
      summary: 승객 그룹 삭제
      description: FR-026 - 그룹 삭제 (승객은 유지되며 groupId만 null로)
      operationId: deletePassengerGroup
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '204':
          description: 그룹 삭제 성공

  # ============================================================================
  # Passenger Endpoints (승객)
  # ============================================================================
  /institutions/{institutionId}/passengers:
    get:
      tags: [Passengers]
      summary: 승객 목록 조회
      description: FR-007 - 기관의 모든 승객 조회 (페이지네이션, 필터링)
      operationId: getPassengers
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: shuttleType
          in: query
          description: 셔틀 유형 필터
          schema:
            $ref: '#/components/schemas/ShuttleType'
        - name: groupId
          in: query
          description: 그룹별 필터
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: 이름 또는 연락처 검색
          schema:
            type: string
      responses:
        '200':
          description: 승객 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPassengers'

    post:
      tags: [Passengers]
      summary: 승객 등록
      description: FR-001 - 신규 승객 등록
      operationId: createPassenger
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePassengerDto'
      responses:
        '201':
          description: 승객 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passenger'
        '409':
          description: 연락처 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /institutions/{institutionId}/passengers/bulk-upload:
    post:
      tags: [Passengers]
      summary: 승객 일괄 업로드 (엑셀)
      description: FR-015 - 엑셀 파일로 승객 정보 일괄 등록
      operationId: bulkUploadPassengers
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file (.xlsx)
      responses:
        '201':
          description: 일괄 업로드 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadResult'
        '400':
          description: 엑셀 파일 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadError'

  /institutions/{institutionId}/passengers/{passengerId}:
    get:
      tags: [Passengers]
      summary: 승객 상세 조회
      description: FR-008 - 승객 정보 및 스케줄 조회
      operationId: getPassenger
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PassengerIdParam'
      responses:
        '200':
          description: 승객 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passenger'

    patch:
      tags: [Passengers]
      summary: 승객 정보 수정
      description: FR-002 - 승객 정보 수정
      operationId: updatePassenger
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PassengerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassengerDto'
      responses:
        '200':
          description: 승객 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passenger'

    delete:
      tags: [Passengers]
      summary: 승객 삭제
      description: FR-003 - 승객 삭제 (CASCADE - 스케줄도 삭제됨)
      operationId: deletePassenger
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PassengerIdParam'
      responses:
        '204':
          description: 승객 삭제 성공

  /institutions/{institutionId}/passengers/{passengerId}/schedule:
    put:
      tags: [Passengers]
      summary: 승객 스케줄 설정/수정
      description: 002-FR-001 - 승객의 희망 탑승/하차 시간 입력
      operationId: upsertPassengerSchedule
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PassengerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerScheduleDto'
      responses:
        '200':
          description: 스케줄 저장 성공 (케어 시간 자동 계산됨)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerSchedule'

    delete:
      tags: [Passengers]
      summary: 승객 스케줄 삭제
      operationId: deletePassengerSchedule
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - $ref: '#/components/parameters/PassengerIdParam'
      responses:
        '204':
          description: 스케줄 삭제 성공

  # ============================================================================
  # Care Time Report Endpoints (002번 기능)
  # ============================================================================
  /institutions/{institutionId}/care-time-report:
    get:
      tags: [Care Time Reports]
      summary: 케어 시간 검증 리포트
      description: 002-FR-018 - 기관의 케어 시간 부족 승객 리포트 생성
      operationId: getCareTimeReport
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
        - name: filterInsufficient
          in: query
          description: 케어 시간 부족 승객만 필터링
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 케어 시간 리포트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTimeReport'

  /institutions/{institutionId}/care-time-warnings:
    get:
      tags: [Care Time Reports]
      summary: 케어 시간 부족 경고 목록
      description: 002-FR-016 - 케어 시간 부족 승객 필터링
      operationId: getCareTimeWarnings
      parameters:
        - $ref: '#/components/parameters/InstitutionIdParam'
      responses:
        '200':
          description: 경고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareTimeWarning'

# ============================================================================
# Components
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  parameters:
    InstitutionIdParam:
      name: institutionId
      in: path
      required: true
      description: 기관 ID (UUID)
      schema:
        type: string
        format: uuid

    VehicleIdParam:
      name: vehicleId
      in: path
      required: true
      description: 차량 ID (UUID)
      schema:
        type: string
        format: uuid

    GroupIdParam:
      name: groupId
      in: path
      required: true
      description: 승객 그룹 ID (UUID)
      schema:
        type: string
        format: uuid

    PassengerIdParam:
      name: passengerId
      in: path
      required: true
      description: 승객 ID (UUID)
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      description: 페이지 번호 (1부터 시작)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  schemas:
    # ========================================================================
    # Institution Schemas
    # ========================================================================
    InstitutionType:
      type: object
      required:
        - id
        - typeCode
        - typeName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        typeCode:
          type: string
          enum: [DAYCARE, GENERAL]
          description: 기관 유형 코드
        typeName:
          type: string
          description: 기관 유형명 (주간보호, 일반)
        minimumCareTimeHours:
          type: integer
          nullable: true
          description: 최소 케어 시간 (주간보호는 8, 일반은 null)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Institution:
      type: object
      required:
        - id
        - businessRegistrationNo
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        businessRegistrationNo:
          type: string
          pattern: '^\d{10}$'
          description: 사업자등록번호 (10자리, 하이픈 제거)
          example: '1234567890'
        name:
          type: string
          maxLength: 100
          description: 기관명
          example: '서울 주간보호센터'
        institutionTypeId:
          type: string
          format: uuid
          nullable: true
        institutionType:
          $ref: '#/components/schemas/InstitutionType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInstitutionDto:
      type: object
      required:
        - businessRegistrationNo
        - name
      properties:
        businessRegistrationNo:
          type: string
          pattern: '^\d{10}$'
          example: '1234567890'
        name:
          type: string
          maxLength: 100
          example: '서울 주간보호센터'
        institutionTypeId:
          type: string
          format: uuid

    UpdateInstitutionDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        institutionTypeId:
          type: string
          format: uuid

    PaginatedInstitutions:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Institution'
        total:
          type: integer
          description: 전체 항목 수
        page:
          type: integer
          description: 현재 페이지
        limit:
          type: integer
          description: 페이지당 항목 수
        totalPages:
          type: integer
          description: 전체 페이지 수

    # ========================================================================
    # Vehicle Schemas
    # ========================================================================
    Vehicle:
      type: object
      required:
        - id
        - lastFourDigits
        - passengerCapacity
        - institutionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        lastFourDigits:
          type: string
          pattern: '^\d{4}$'
          description: 차량번호 뒤 4자리
          example: '1234'
        passengerCapacity:
          type: integer
          minimum: 5
          maximum: 15
          description: 승객 정원
          example: 12
        institutionId:
          type: string
          format: uuid
        currentGroupId:
          type: string
          format: uuid
          nullable: true
          description: 현재 연결된 승객 그룹 ID
        currentGroup:
          $ref: '#/components/schemas/PassengerGroup'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateVehicleDto:
      type: object
      required:
        - lastFourDigits
        - passengerCapacity
      properties:
        lastFourDigits:
          type: string
          pattern: '^\d{4}$'
          example: '1234'
        passengerCapacity:
          type: integer
          minimum: 5
          maximum: 15
          example: 12
        currentGroupId:
          type: string
          format: uuid
          nullable: true

    UpdateVehicleDto:
      type: object
      properties:
        lastFourDigits:
          type: string
          pattern: '^\d{4}$'
        passengerCapacity:
          type: integer
          minimum: 5
          maximum: 15

    # ========================================================================
    # Passenger Group Schemas
    # ========================================================================
    PassengerGroup:
      type: object
      required:
        - id
        - institutionId
        - groupCode
        - name
        - totalPassengerCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        institutionId:
          type: string
          format: uuid
        groupCode:
          type: string
          maxLength: 20
          description: 그룹 코드 (기관 내 고유)
          example: 'GRP-001'
        name:
          type: string
          maxLength: 100
          description: 그룹명
          example: '오전 A조'
        totalPassengerCount:
          type: integer
          description: 총 승객 수
          example: 15
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PassengerGroupDetail:
      allOf:
        - $ref: '#/components/schemas/PassengerGroup'
        - type: object
          properties:
            passengers:
              type: array
              items:
                $ref: '#/components/schemas/Passenger'
            vehicles:
              type: array
              items:
                $ref: '#/components/schemas/Vehicle'

    CreatePassengerGroupDto:
      type: object
      required:
        - groupCode
        - name
        - passengerIds
      properties:
        groupCode:
          type: string
          maxLength: 20
          example: 'GRP-001'
        name:
          type: string
          maxLength: 100
          example: '오전 A조'
        passengerIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: 그룹에 할당할 승객 ID 목록

    UpdatePassengerGroupDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        addPassengerIds:
          type: array
          items:
            type: string
            format: uuid
          description: 추가할 승객 ID 목록
        removePassengerIds:
          type: array
          items:
            type: string
            format: uuid
          description: 제거할 승객 ID 목록

    # ========================================================================
    # Passenger Schemas
    # ========================================================================
    ShuttleType:
      type: string
      enum: [MORNING, EVENING, TEMPORARY]
      description: |
        셔틀 유형:
        - MORNING: 오전 셔틀 (여러 탑승지 → 기관)
        - EVENING: 오후 셔틀 (기관 → 여러 하차지)
        - TEMPORARY: 임시 셔틀 (동적 요청)

    Passenger:
      type: object
      required:
        - id
        - name
        - phoneNumber
        - pickupAddress
        - dropoffAddress
        - shuttleType
        - institutionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
          example: '김철수'
        phoneNumber:
          type: string
          pattern: '^01[0-9]{9}$'
          description: 연락처 (하이픈 제거)
          example: '01012345678'
        pickupAddress:
          type: string
          maxLength: 200
          example: '서울특별시 강남구 테헤란로 123'
        dropoffAddress:
          type: string
          maxLength: 200
          example: '서울특별시 강남구 역삼동 456'
        shuttleType:
          $ref: '#/components/schemas/ShuttleType'
        institutionId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
          nullable: true
        group:
          $ref: '#/components/schemas/PassengerGroup'
        schedule:
          $ref: '#/components/schemas/PassengerSchedule'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePassengerDto:
      type: object
      required:
        - name
        - phoneNumber
        - pickupAddress
        - dropoffAddress
        - shuttleType
      properties:
        name:
          type: string
          maxLength: 50
          example: '김철수'
        phoneNumber:
          type: string
          pattern: '^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$'
          description: 연락처 (하이픈 포함 가능, 저장 시 제거됨)
          example: '010-1234-5678'
        pickupAddress:
          type: string
          maxLength: 200
        dropoffAddress:
          type: string
          maxLength: 200
        shuttleType:
          $ref: '#/components/schemas/ShuttleType'
        groupId:
          type: string
          format: uuid
          nullable: true
        schedule:
          $ref: '#/components/schemas/PassengerScheduleDto'

    UpdatePassengerDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        phoneNumber:
          type: string
          pattern: '^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$'
        pickupAddress:
          type: string
          maxLength: 200
        dropoffAddress:
          type: string
          maxLength: 200
        shuttleType:
          $ref: '#/components/schemas/ShuttleType'
        groupId:
          type: string
          format: uuid
          nullable: true

    PaginatedPassengers:
      type: object
      required:
        - data
        - total
        - page
        - limit
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    BulkUploadResult:
      type: object
      required:
        - successCount
        - failureCount
        - totalRows
        - errors
      properties:
        successCount:
          type: integer
          description: 성공한 행 수
        failureCount:
          type: integer
          description: 실패한 행 수
        totalRows:
          type: integer
          description: 전체 행 수 (헤더 제외)
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BulkUploadRowError'

    BulkUploadRowError:
      type: object
      required:
        - row
        - errors
      properties:
        row:
          type: integer
          description: 에러가 발생한 행 번호
        data:
          type: object
          description: 해당 행의 원본 데이터
        errors:
          type: array
          items:
            type: string
          description: 검증 에러 메시지 목록

    BulkUploadError:
      type: object
      required:
        - statusCode
        - message
        - errors
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: '엑셀 파일 검증에 실패했습니다'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BulkUploadRowError'

    # ========================================================================
    # Passenger Schedule Schemas (002번 기능)
    # ========================================================================
    PassengerSchedule:
      type: object
      required:
        - id
        - passengerId
        - desiredPickupTime
        - desiredDropoffTime
        - careTimeHours
        - isCareTimeInsufficient
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        desiredPickupTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 희망 탑승 시간 (HH:MM)
          example: '09:00'
        desiredDropoffTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 희망 하차 시간 (HH:MM)
          example: '17:30'
        careTimeHours:
          type: number
          format: float
          description: 케어 시간 간격 (시간 단위, 자동 계산)
          example: 8.5
        isCareTimeInsufficient:
          type: boolean
          description: 8시간 미만 여부 (자동 계산)
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PassengerScheduleDto:
      type: object
      required:
        - desiredPickupTime
        - desiredDropoffTime
      properties:
        desiredPickupTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:00'
        desiredDropoffTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '17:30'

    CareTimeReport:
      type: object
      required:
        - institutionId
        - institutionName
        - institutionType
        - totalPassengers
        - passengersWithSchedule
        - insufficientCareTimeCount
        - generatedAt
        - passengers
      properties:
        institutionId:
          type: string
          format: uuid
        institutionName:
          type: string
        institutionType:
          $ref: '#/components/schemas/InstitutionType'
        totalPassengers:
          type: integer
          description: 전체 승객 수
        passengersWithSchedule:
          type: integer
          description: 스케줄이 등록된 승객 수
        insufficientCareTimeCount:
          type: integer
          description: 케어 시간 부족 승객 수
        generatedAt:
          type: string
          format: date-time
          description: 리포트 생성 시각
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/CareTimeReportItem'

    CareTimeReportItem:
      type: object
      required:
        - passengerId
        - passengerName
        - phoneNumber
        - desiredPickupTime
        - desiredDropoffTime
        - careTimeHours
        - isCareTimeInsufficient
      properties:
        passengerId:
          type: string
          format: uuid
        passengerName:
          type: string
        phoneNumber:
          type: string
        desiredPickupTime:
          type: string
        desiredDropoffTime:
          type: string
        careTimeHours:
          type: number
          format: float
        isCareTimeInsufficient:
          type: boolean
        groupCode:
          type: string
          nullable: true
        groupName:
          type: string
          nullable: true

    CareTimeWarning:
      type: object
      required:
        - passengerId
        - passengerName
        - phoneNumber
        - careTimeHours
        - minimumRequired
        - shortage
      properties:
        passengerId:
          type: string
          format: uuid
        passengerName:
          type: string
        phoneNumber:
          type: string
        careTimeHours:
          type: number
          format: float
          description: 현재 케어 시간
        minimumRequired:
          type: number
          format: float
          description: 최소 요구 케어 시간 (8시간)
        shortage:
          type: number
          format: float
          description: 부족 시간
          example: 0.5

    # ========================================================================
    # Common Schemas
    # ========================================================================
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: '요청 처리 중 오류가 발생했습니다'
        error:
          type: string
          example: 'Bad Request'
        details:
          type: array
          items:
            type: string
          description: 상세 에러 메시지 목록

  responses:
    NotFoundError:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: '요청한 리소스를 찾을 수 없습니다'
            error: 'Not Found'

    ConflictError:
      description: 리소스 충돌 (중복된 값 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            message: '이미 존재하는 값입니다'
            error: 'Conflict'

    UnauthorizedError:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: '인증이 필요합니다'
            error: 'Unauthorized'

    ForbiddenError:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: '접근 권한이 없습니다'
            error: 'Forbidden'
