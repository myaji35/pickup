<!DOCTYPE html>
<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pickup MaaS - 관리자 로그인</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0A4DAA",
              "background-light": "#f6f7f8",
              "background-dark": "#101a22",
            },
            fontFamily: {
              "display": ["Noto Sans KR", "Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<main class="flex-1">
<div class="flex min-h-screen">
<div class="relative hidden w-1/2 flex-col items-center justify-center bg-slate-900 lg:flex">
<div class="absolute inset-0 bg-center bg-no-repeat bg-cover opacity-20" data-alt="Abstract network of light trails representing interconnected routes on a dark background" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBR0u1knDXpAt0t8DUtek84L1Ty8h_wDSpWpY2KT5fePtMg5QgqqE7F6esEvk8xxkOo8Xdt7FhF7RI7raB6NoJmaShDdZjzK4KNIV93H1gDisMyuetN7opIuXnl5oeAd2LvqmscmUawE5IK_uKvvdpNgDW-NuNn893Udl4PH5Kqk33k8QlmKi2w6D7s_KTS9coGAIyOiyt9cUlrbzYj74MlC2nzUqAq9wMu21z-Y5VGE0-aiofh4OQXDhoVWstqUDa303E4wVUGjbQ");'></div>
<div class="relative z-10 flex flex-col items-start p-12 text-white">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-4xl">local_shipping</span>
<h1 class="text-3xl font-bold">Pickup MaaS</h1>
</div>
<p class="mt-4 text-lg text-slate-300">미래의 차량 관리가 여기에 있습니다. 최대 효율성을 위한 AI 기반 경로 최적화.</p>
</div>
</div>
<div class="flex w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark lg:w-1/2">
<div class="w-full max-w-md p-6 sm:p-12">
<div class="flex flex-col gap-3 mb-8">
<p class="text-[#333333] dark:text-slate-200 text-4xl font-black leading-tight tracking-[-0.033em]">관리자 로그인</p>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal">차량을 관리하려면 로그인하세요.</p>
</div>
<form class="flex flex-col gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#333333] dark:text-slate-200 text-base font-medium leading-normal pb-2">이메일 / 사용자 이름</p>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">person</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#333333] dark:text-slate-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] pl-12 text-base font-normal leading-normal" placeholder="이메일 또는 사용자 이름을 입력하세요" type="email" value=""/>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#333333] dark:text-slate-200 text-base font-medium leading-normal pb-2">비밀번호</p>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#333333] dark:text-slate-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] pl-12 pr-12 text-base font-normal leading-normal" placeholder="비밀번호를 입력하세요" type="password" value=""/>
<button aria-label="비밀번호 표시/숨기기" class="absolute right-4 text-slate-400 dark:text-slate-500" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</label>
<div class="flex flex-wrap justify-between items-center mt-2">
<label class="flex gap-x-3 py-3 flex-row items-center cursor-pointer">
<input class="h-5 w-5 rounded border-slate-300 dark:border-slate-600 border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:var(--checkbox-tick-svg,url('data:image/svg+xml,%3csvg_viewBox=%270_0_16_16%27_fill=%27white%27_xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath_d=%27M12.207_4.793a1_1_0_010_1.414l-5_5a1_1_0_01-1.414_0l-2-2a1_1_0_011.414-1.414L6.5_9.086l4.293-4.293a1_1_0_011.414_0z%27/%3e%3c/svg%3e'))] focus:ring-2 focus:ring-offset-0 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 focus:outline-none" type="checkbox"/>
<p class="text-[#333333] dark:text-slate-200 text-base font-normal leading-normal select-none">로그인 상태 유지</p>
</label>
<a class="text-primary text-base font-medium hover:underline" href="#">비밀번호를 잊으셨나요?</a>
</div>
<button class="flex w-full h-14 items-center justify-center rounded-lg bg-primary text-white text-base font-bold leading-normal mt-4 hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 transition-colors">로그인</button>
</form>
</div>
<footer class="w-full max-w-md p-6 text-center text-slate-500 dark:text-slate-400 text-sm">
<p>© 2024 Pickup MaaS Inc. | <a class="hover:underline text-primary" href="#">고객지원</a></p>
</footer>
</div>
</div>
</main>
</div>
</div>
</body></html>
