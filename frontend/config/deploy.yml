# Pickup MaaS — Next.js Admin Portal Kamal Deploy Config
# 접속: http://pickup.158.247.235.31.nip.io
# 업데이트: 2026-02-28

service: pickup_web
image: ghcr.io/myaji35/pickup_web

servers:
  web:
    - 158.247.235.31

ssh:
  user: root

proxy:
  host: pickup.158.247.235.31.nip.io
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: myaji35
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    NEXT_OUTPUT: standalone
    NEXT_PUBLIC_RAILS_API_URL: "http://pickup-api.158.247.235.31.nip.io/api/v1"
    NEXT_PUBLIC_ENV: production

# ── 배포 타임아웃 ──────────────────────────────
deploy_timeout: 90

# ── 빌더 (서버에서 직접 빌드 — QEMU 크로스컴파일 우회) ──
builder:
  arch: amd64
  remote: ssh://root@158.247.235.31

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
