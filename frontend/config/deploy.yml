# Pickup MaaS — Next.js Admin Portal Kamal Deploy Config
# 접속: http://pickup.158.247.235.31.nip.io
# 업데이트: 2026-02-28

service: pickup_web
image: ghcr.io/myaji35/pickup_web

servers:
  web:
    - 158.247.235.31

ssh:
  user: root

proxy:
  host: pickup.158.247.235.31.nip.io
  app_port: 3000

registry:
  server: ghcr.io
  username: myaji35
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    NEXT_OUTPUT: standalone
    NEXT_PUBLIC_RAILS_API_URL: "http://pickup-api.158.247.235.31.nip.io/api/v1"
    NEXT_PUBLIC_ENV: production

builder:
  arch: amd64

healthcheck:
  path: /
  port: 3000
  interval: 10s
  timeout: 5s
  retries: 5
  initial_delay_at: 15

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
